name: Daily Pipeline Run

on:
  schedule:
    # UTC 16:00 = 02:00 market time (fixed UTC+10). AEMO refreshes its CSV at 00:00, and scheduled runs
    # are often delayed by hours, so starting early still delivers the forecast by the morning.
    - cron: "0 16 * * *"
  workflow_dispatch: {} 

permissions:
  contents: write  

# Only one run at a time: overlapping runs (e.g. cron + manual) would make the later push fail
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore NEMOSIS cache
        uses: actions/cache@v4
        with:
          path: data/raw/nemosis_cache
          key: nemosis-${{ github.run_id }}
          restore-keys: nemosis-

      - name: Run pipeline
        run: python main.py

      # v2: rolling-window forecast for today + tomorrow (appends to data/forecasts/forecast_log.csv)
      - name: Run day-ahead forecast
        run: python run_day_ahead.py

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/raw/aemo_data_1year/ data/forecasts/
          git diff --cached --quiet || git commit -m "Automated pipeline run: update predictions"
          # main may have moved during the run (e.g. a push from local), so integrate it before pushing
          git pull --rebase
          git push
